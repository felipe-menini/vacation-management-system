name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: licenses
          POSTGRES_USER: licenses
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licenses -d licenses"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/Licenses.slnx

      - name: Build
        run: dotnet build src/backend/Licenses.slnx --configuration Release --no-restore

      - name: Test
        env:
          LICENSES_TEST_POSTGRES_HOST: localhost
          LICENSES_TEST_POSTGRES_PORT: 5432
          LICENSES_TEST_POSTGRES_ADMIN_DATABASE: postgres
          LICENSES_TEST_POSTGRES_USERNAME: licenses
          LICENSES_TEST_POSTGRES_PASSWORD: change-me
        run: dotnet test src/backend/Licenses.slnx --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/licenses-web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/licenses-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
