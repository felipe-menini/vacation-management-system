services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licenses}
      POSTGRES_USER: ${POSTGRES_USER:-licenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/backend/Licenses.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ApplicationDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-licenses};Username=${POSTGRES_USER:-licenses};Password=${POSTGRES_PASSWORD:-change-me}
      PrivateDocumentStorage__RootPath: /var/lib/licenses/private-documents
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - private-documents-data:/var/lib/licenses/private-documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: src/backend/Licenses.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__ApplicationDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-licenses};Username=${POSTGRES_USER:-licenses};Password=${POSTGRES_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/frontend/licenses-web/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  private-documents-data:
